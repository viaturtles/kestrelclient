# Builds the Windows installer and attaches it to a draft GitHub Release
# whenever a version tag like v0.1.0 is pushed.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: Kestrel Client - Minecraft

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Kestrel Client - Minecraft/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: Kestrel Client - Minecraft/src-tauri
      - run: npm ci
      # The notes shown in Kestrel's "Update available" prompt and on the release page.
      - id: notes
        shell: bash
        run: |
          {
            echo "body<<KESTREL_NOTES_EOF"
            cat RELEASE_NOTES.md 2>/dev/null || echo "Bug fixes and improvements."
            echo ""
            echo "Windows may say \"Windows protected your PC\" the first time; choose More info, then Run anyway."
            echo "KESTREL_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update so installed copies of Kestrel trust it (see README).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: Kestrel Client - Minecraft
          tagName: ${{ github.ref_name }}
          releaseName: Kestrel ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
